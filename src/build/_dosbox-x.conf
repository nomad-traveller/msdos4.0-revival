[dosbox]
machine=cga
output=sdl
memsize=16

[cpu]
cputype=486
cycles=max

[render]
aspect=true

[midi]
mididevice=none

[sblaster]
sbtype=none

[serial]
serial1=disabled
serial2=disabled
parallel1=disabled

[autoexec]
mount c /home/user/storage/microsoft/mydos/v4.0
c:
set lib=c:\src\tools\bld\lib
set include=c:\src\tools\bld\inc
set init=c:\src\tools
set temp=c:\src
set path=c:\src\tools
set country=usa-ms
c:\src\build\dosall.bat
